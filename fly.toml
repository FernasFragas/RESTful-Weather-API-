# fly.toml app configuration file generated for letsfuckingtravel on 2025-04-06T18:00:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'letsfuckingtravel'
primary_region = 'mad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Add a mount point for the persistent volume
[mounts]
  source="weather_data" # Name of the volume to be created
  destination="/data"    # Path inside the container where the volume will be mounted

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
